version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next-runtime:
        patterns: ["next", "eslint-config-next"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
